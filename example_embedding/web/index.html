<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demonstrates how to use the jsonld2cards plugin.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jsonld2cards_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jsonld2cards_example</title>
  <link rel="manifest" href="manifest.json">


  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script type="application/ld+json">{"@context":"http://schema.googleapis.com/","@type":"MusicAlbum","@id":"https://open.spotify.com/album/4F1fUukNCGBD5YjDViOJtu","url":"https://open.spotify.com/album/4F1fUukNCGBD5YjDViOJtu","name":"Semantics","description":"Listen to Semantics on Spotify. St. Emerald \u00B7 Album \u00B7 2022 \u00B7 7 songs.","datePublished":"2022-08-19","potentialAction":{"@type":"ListenAction","target":[{"@type":"EntryPoint","urlTemplate":"https://open.spotify.com/album/4F1fUukNCGBD5YjDViOJtu?autoplay=true","actionPlatform":["http://schema.org/DesktopWebPlatform","http://schema.org/IOSPlatform","http://schema.googleapis.com/GoogleAudioCast","http://schema.googleapis.com/GoogleVideoCast"]},"android-app://com.spotify.music/spotify/album/4F1fUukNCGBD5YjDViOJtu/play"],"expectsAcceptanceOf":{"@type":"Offer","category":"free","eligibleRegion":[]}}}</script>
</head>
<body>
<section class="contents">
  <article>
    <div id="flutter_target"></div>
  </article>

  <aside id="demo_controls">
    <h1>Element embedding</h1>

    <fieldset id="fx">
      <legend>Effects</legend>
      <input value="Shadow" data-fx="shadow" type="button" class="fx"/>
      <input value="Mirror 🧪" data-fx="mirror" type="button" class="fx"/>
      <input value="Resize" data-fx="resize" type="button" class="fx align-top"/>
      <div class="tight">
        <input value="Spin" data-fx="spin" type="button" class="fx"/>
        <input type="range" value="0" min="-180" max="180" list="markers" id="rotation"
               class="tight"/>
        <datalist id="markers">
          <option value="-180"></option>
          <option value="-135"></option>
          <option value="-45"></option>
          <option value="0"></option>
          <option value="45"></option>
          <option value="135"></option>
          <option value="180"></option>
        </datalist>
      </div>
      <input value="Device" data-fx="handheld" type="button" class="fx"/>
    </fieldset>

    <fieldset id="interop">
      <legend>JS Interop</legend>

      <label for="screen-selector">
        Screen
        <select name="screen-select" id="screen-selector" class="screen">
          <option value="counter">Counter</option>
          <option value="textField">TextField</option>
          <option value="custom">Custom App</option>
        </select>
      </label>

      <label for="value">
        Value
        <input id="value" value="" type="text" readonly/>
      </label>
      <input
              id="increment"
              value="Increment"
              type="button"
      />
    </fieldset>
  </aside>
</section>
  <script>
    window.addEventListener('load', function(ev) {
      let target = document.querySelector("#flutter_target");
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: async function(engineInitializer) {
          let appRunner = await engineInitializer.initializeEngine({hostElement: target})
          await appRunner.runApp();
        }
      });
    });
  </script>
<!--  <script src="js/demo-js-interop.js" defer></script>-->
  <script src="js/demo-css-fx.js" defer></script>
</body>
</html>
